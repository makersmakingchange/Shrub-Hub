title: Shrub Hub
description: The Shrub Hub is a low cost digital switch interface that takes up to 3 3.5mm
  assistive switches and can output up to 5 different keystrokes to the
  connected device.
intended-use: The Shrub Hub is intended to allow a user to control their computer or digital
  device using up to three assistive switches.
